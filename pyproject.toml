[project]
name = "ananke"
version = "0.1.0"
description = "A reproducible three-tier memory evaluation instrument for comparing persistence- and frequency-based selection regimes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "agent-memory",
    "evaluation",
    "llm",
    "memory-systems",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "openai>=2.45.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
]

[project.urls]
Homepage = "https://github.com/yinxing233/Ananke"
Repository = "https://github.com/yinxing233/Ananke.git"
Issues = "https://github.com/yinxing233/Ananke/issues"
Report = "https://github.com/yinxing233/Ananke/blob/main/REPORT.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
